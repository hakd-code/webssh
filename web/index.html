<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="基于浏览器的 WebSSH 在线服务器管理平台" />
    <title>WebSSH 管理平台</title>
    <script>
      // 首屏防闪烁:挂载前按主题偏好应用 dark class
      try {
        var mode = localStorage.getItem('webssh-theme') || 'system'
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
